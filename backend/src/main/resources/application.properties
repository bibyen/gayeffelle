spring.application.name=gayeffelle

# Pull optional local overrides from backend/.env (git-ignored). Create one from
# .env.example to point at your own database without touching this file.
spring.config.import=optional:file:.env[.properties]

# Datasource values fall back to the local `supabase start` defaults, but every
# one can be overridden via .env or an environment variable of the same name.
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:54322/postgres}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
